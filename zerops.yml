zerops:
  - setup: python
    build:
      base: python@3.12
      buildCommands:
        - python3 -m pip install -r requirements.txt
      deployFiles:
        - ./
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      start: uvicorn main:app --host 0.0.0.0 --port 8000
