zerops:
  - setup: python
    build:
      base: python@3.12
      buildCommands:
        - pip install --target=./vendor -r requirements.txt
      deployFiles:
        - ./
        - ./vendor
      cache:
        - vendor
    run:
      base: python@3.12
      envVariables:
        PYTHONPATH: /var/www/vendor
      ports:
        - port: 8000
          httpSupport: true
      start: python3 -m uvicorn main:app --host 0.0.0.0 --port 8000
