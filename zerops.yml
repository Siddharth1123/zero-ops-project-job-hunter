zerops:
  - setup: docker
    build:
      base: ubuntu@22.04
      deployFiles:
        - ./
    run:
      base: docker@26.1.5
      prepareCommands:
        - cd /var/www && docker build -t job-hunter-app .
      start: docker run --network=host job-hunter-app
      ports:
        - port: 8000
          httpSupport: true
